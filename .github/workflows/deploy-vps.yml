# ============================================================
# Deploy ke VPS produksi (idcloudhost) — /opt/arkxmotion-studio
#
# Dua gerbang dijalankan SEBELUM proses produksi diganti. Kalau salah satu
# gagal, deploy dibatalkan dan versi lama tetap melayani user — jadi commit
# yang merusak server tidak pernah sampai ke produksi.
#
#   1. check-undefined.mjs  — identifier tak terdefinisi (TS2304/TS2552) &
#                             API CommonJS di file ESM
#   2. smoke-test.sh        — benar-benar menjalankan server lalu memastikan
#                             /api/health merespons (menangkap server yang
#                             gagal boot, penyebab 502 di semua endpoint)
#   3. check-boot-backup.sh — sesudah pm2 restart, memastikan proses yang BARU
#                             start benar-benar meninggalkan snapshot backup.
#                             Menangkap kondisi 17 Sep 2026: boot produksi
#                             tidak menulis snapshot sama sekali, dan itu tidak
#                             terlihat dari luar — deploy tetap dilaporkan sukses.
#
# Konteks: 42 file di repo ini (extensions/, workers/, cloudflare-worker/,
# skrip root, public/sw.js, vite.config.ts, shared/) berada di luar semua
# tsconfig, dan `tsc -b` tidak memeriksa folder server/. Kedua gerbang di atas
# menutup celah itu.
# ============================================================
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # izinkan trigger manual
    inputs:
      skip_backup_gate:
        description: 'Lewati gerbang 3 (boot harus meninggalkan snapshot). Hanya untuk memulihkan deploy darurat.'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy ke VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 12m
          script: |
            set -e
            cd /opt/arkxmotion-studio

            echo "🔄 Menarik perubahan terbaru..."
            git fetch origin main
            # `npm install` di VPS mengubah package-lock.json; kembalikan dulu
            # supaya pull tidak gagal karena perubahan lokal itu.
            git checkout -- package-lock.json 2>/dev/null || true
            git pull --ff-only origin main
            echo "   HEAD: $(git log --oneline -1)"

            echo "📦 Memasang dependencies..."
            npm install

            echo "🔎 Gerbang 1 — identifier tak terdefinisi..."
            node scripts/check-undefined.mjs

            echo "🔨 Membangun frontend..."
            npm run build

            echo "🧪 Gerbang 2 — smoke test (server harus benar-benar bisa boot)..."
            if ! bash scripts/smoke-test.sh; then
              echo "❌ Deploy DIBATALKAN — server baru gagal boot. Versi lama tetap jalan."
              exit 1
            fi

            echo "🔄 Restart server..."
            RESTART_MARKER=$(date +%s)
            pm2 restart arkxmotion --update-env
            pm2 save

            # github.event.inputs (bukan inputs.*) supaya ekspresinya sah juga
            # saat workflow dipicu push, bukan hanya lewat workflow_dispatch.
            if [ "${{ github.event.inputs.skip_backup_gate }}" = "true" ]; then
              echo "⚠️  GERBANG 3 DILEWATI atas permintaan manual (skip_backup_gate=true)."
              echo "    Pastikan menyusul dengan: bash scripts/check-boot-backup.sh"
            else
              echo "🧪 Gerbang 3 — boot harus meninggalkan snapshot backup..."
              if ! bash scripts/check-boot-backup.sh "$RESTART_MARKER"; then
                echo "❌ Deploy DITANDAI GAGAL. Versi baru sudah berjalan, tapi boot-nya tidak"
                echo "   meninggalkan snapshot backup. Diagnosis ada di keluaran di atas."
                echo "   Proses lama TIDAK dikembalikan otomatis (restart sudah terjadi)."
                exit 1
              fi
            fi

            echo "✅ Deploy selesai pada $(date)"
