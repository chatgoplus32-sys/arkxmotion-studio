# ============================================================
# Deploy ke VPS produksi (idcloudhost) — /opt/arkxmotion-studio
#
# Gerbang 1 dan 2 berjalan SEBELUM proses produksi diganti: kalau salah satu
# gagal, deploy dibatalkan dan versi lama tetap melayani user — jadi commit
# yang merusak server tidak pernah sampai ke produksi. Gerbang 3a dan 3 berjalan
# SESUDAH restart dan mengukur hasilnya.
#
#   1. check-undefined.mjs  — identifier tak terdefinisi (TS2304/TS2552) &
#                             API CommonJS di file ESM
#   2. smoke-test.sh        — benar-benar menjalankan server lalu memastikan
#                             /api/health merespons (menangkap server yang
#                             gagal boot, penyebab 502 di semua endpoint)
#   3. check-boot-backup.sh — sesudah pm2 restart, memastikan proses yang BARU
#                             start benar-benar meninggalkan snapshot backup.
#                             Menangkap kondisi 17 Sep 2026: boot produksi
#                             tidak menulis snapshot sama sekali, dan itu tidak
#                             terlihat dari luar — deploy tetap dilaporkan sukses.
#   3a. check-prod-env.sh   — dijalankan SEBELUM gerbang 3: proses yang melayani
#                             harus berjalan dengan NODE_ENV=production. Sebab
#                             tiga gerbang 3 yang merah ternyata bukan backup:
#                             restart lama menyegarkan environment dari shell
#                             sesi SSH (tanpa NODE_ENV), sehingga proses produksi
#                             berjalan mode dev dan backup otomatis dilewati.
#
# Konteks: 42 file di repo ini (extensions/, workers/, cloudflare-worker/,
# skrip root, public/sw.js, vite.config.ts, shared/) berada di luar semua
# tsconfig, dan `tsc -b` tidak memeriksa folder server/. Kedua gerbang di atas
# menutup celah itu.
# ============================================================
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # izinkan trigger manual
    inputs:
      skip_backup_gate:
        description: 'Lewati gerbang 3a dan 3 (mode produksi + snapshot boot). Hanya untuk memulihkan deploy darurat.'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy ke VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 12m
          script: |
            set -e
            cd /opt/arkxmotion-studio

            echo "🔄 Menarik perubahan terbaru..."
            git fetch origin main
            # `npm install` di VPS mengubah package-lock.json; kembalikan dulu
            # supaya pull tidak gagal karena perubahan lokal itu.
            git checkout -- package-lock.json 2>/dev/null || true
            git pull --ff-only origin main
            echo "   HEAD: $(git log --oneline -1)"

            echo "📦 Memasang dependencies..."
            npm install

            echo "🔎 Gerbang 1 — identifier tak terdefinisi..."
            node scripts/check-undefined.mjs

            echo "🔨 Membangun frontend..."
            npm run build

            echo "🧪 Gerbang 2 — smoke test (server harus benar-benar bisa boot)..."
            if ! bash scripts/smoke-test.sh; then
              echo "❌ Deploy DIBATALKAN — server baru gagal boot. Versi lama tetap jalan."
              exit 1
            fi

            echo "🔄 Restart server..."
            RESTART_MARKER=$(date +%s)
            # Environment proses diambil dari ecosystem.config.cjs — satu sumber
            # kebenaran untuk NODE_ENV dan PORT.
            #
            # Proses lama dihapus dulu, lalu dinyalakan lewat jalur "start".
            # Jalur itu me-resolve script di sisi CLI; jalur restart/reload
            # mengirim konfigurasi MENTAH ke daemon, dan daemon tidak bisa
            # me-resolve script relatif di dalamnya — 17 Sep 2026 seluruh /api
            # produksi 502 dan tidak pulih sendiri karena itu.
            pm2 delete arkxmotion >/dev/null 2>&1 || true
            pm2 start ecosystem.config.cjs
            pm2 save

            # Jangan tinggalkan produksi mati: kalau setelah itu server tetap
            # tidak menjawab, nyalakan langsung dengan environment eksplisit.
            if ! curl -sf --max-time 10 "http://127.0.0.1:6000/api/health" >/dev/null; then
              echo "⚠️  Server belum menjawab — mencoba jalur darurat (tsx langsung)..."
              pm2 delete arkxmotion >/dev/null 2>&1 || true
              NODE_ENV=production PORT=6000 pm2 start "$(pwd)/node_modules/.bin/tsx" --name arkxmotion -- server/index.ts
              pm2 save
            fi

            # github.event.inputs (bukan inputs.*) supaya ekspresinya sah juga
            # saat workflow dipicu push, bukan hanya lewat workflow_dispatch.
            if [ "${{ github.event.inputs.skip_backup_gate }}" = "true" ]; then
              echo "⚠️  GERBANG 3a dan 3 DILEWATI atas permintaan manual (skip_backup_gate=true)."
              echo "    Pastikan menyusul dengan: bash scripts/check-prod-env.sh && bash scripts/check-boot-backup.sh"
            else
              # Gerbang 3a lebih dulu: kalau prosesnya tidak berjalan sebagai
              # production, backup otomatis memang tidak akan pernah jalan — dan
              # sebabnya harus dinamai di sini, bukan muncul di gerbang 3
              # sebagai masalah backup.
              echo "🧪 Gerbang 3a — proses produksi harus berjalan dengan NODE_ENV=production..."
              if ! bash scripts/check-prod-env.sh; then
                echo "❌ Deploy DITANDAI GAGAL: proses yang baru restart tidak berjalan sebagai production."
                echo "   Restart harus lewat ecosystem.config.cjs supaya NODE_ENV sampai ke proses;"
                echo "   diagnosis lengkap ada di keluaran di atas."
                exit 1
              fi

              echo "🧪 Gerbang 3 — boot harus meninggalkan snapshot backup..."
              if ! bash scripts/check-boot-backup.sh "$RESTART_MARKER"; then
                echo "❌ Deploy DITANDAI GAGAL. Versi baru sudah berjalan, tapi boot-nya tidak"
                echo "   meninggalkan snapshot backup. Diagnosis ada di keluaran di atas."
                echo "   Proses lama TIDAK dikembalikan otomatis (restart sudah terjadi)."
                exit 1
              fi
            fi

            echo "✅ Deploy selesai pada $(date)"
