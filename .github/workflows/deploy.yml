# ============================================================
# Auto-Deploy to VPS — triggers on push to main
# ============================================================
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            APP_DIR="/var/www/arkxmotion-studio/arkxmotion-studio"
            cd "$APP_DIR"

            echo "🔄 Pulling latest changes..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Installing dependencies..."
            npm install --production=false

            # Cek identifier tak terdefinisi + API CommonJS di file ESM
            # (pernah menyebabkan outage produksi: server gagal boot / R2 tak pernah upload)
            echo "🔎 Memeriksa identifier tak terdefinisi..."
            node scripts/check-undefined.mjs
            echo "🔨 Building frontend..."
            npm run build

            echo "🧪 Smoke test (gate sebelum restart)..."
            if ! bash scripts/smoke-test.sh; then
              echo "❌ Server baru gagal boot — restart DIBATALKAN, versi lama tetap jalan."
              exit 1
            fi

            echo "🔄 Restarting server..."
            if pm2 describe arkxmotion-studio > /dev/null 2>&1; then
              pm2 restart arkxmotion-studio --update-env
            else
              pm2 start ecosystem.config.cjs
              pm2 save
            fi

            echo "🌐 Reloading Nginx..."
            nginx -t && systemctl reload nginx 2>/dev/null || true

            echo "✅ Deploy complete at $(date)"
            pm2 logs arkxmotion-studio --lines 5 --nostream
