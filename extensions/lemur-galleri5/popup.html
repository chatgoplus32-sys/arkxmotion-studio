<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galleri5 Token</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">G5</div>
    <div>
      <h1>Galleri5 Token Capture</h1>
      <div class="subtitle">for ARKx Motion Studio</div>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Checking...</span>
  </div>

  <div class="token-list" id="tokenList">
    <div class="empty" id="emptyState">
      <div class="icon">&#x1f511;</div>
      <p>No tokens captured yet.<br>
      Login to <a href="https://aistudio.galleri5.com" target="_blank">aistudio.galleri5.com</a> and the token will be captured automatically.</p>
    </div>
  </div>

  <div class="footer">
    <span class="version">v1.0.1</span>
    <div class="footer-btns">
      <button class="btn btn-secondary" id="refreshBtn">&#x1f504; Refresh</button>
      <button class="btn btn-danger" id="clearBtn">&#x1f5d1;&#xfe0f; Clear</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
