<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; width: 420px; padding: 16px; }
    h1 { font-size: 16px; color: #4fc3f7; margin-bottom: 8px; }
    h2 { font-size: 13px; color: #90a4ae; margin: 12px 0 6px; }
    .btn { background: #4fc3f7; color: #1a1a2e; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; margin: 4px; }
    .btn:hover { background: #81d4fa; }
    .card { background: #16213e; border-radius: 8px; padding: 12px; margin: 8px 0; border: 1px solid #1a3a5c; }
    .header-row { display: flex; gap: 8px; margin: 2px 0; }
    .header-name { color: #4fc3f7; font-weight: 600; min-width: 160px; font-size: 11px; }
    .header-val { color: #a5d6a7; font-size: 11px; word-break: break-all; }
    .status { font-size: 12px; color: #66bb6a; margin: 8px 0; }
    .error { color: #ef5350; }
    #tokenArea { width: 100%; height: 80px; background: #0d1b2a; color: #a5d6a7; border: 1px solid #1a3a5c; border-radius: 4px; font-family: monospace; font-size: 10px; padding: 6px; resize: vertical; }
    #firebaseToken { background: #0d1b2a; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 10px; word-break: break-all; color: #fff59d; max-height: 150px; overflow-y: auto; margin: 4px 0; white-space: pre-wrap; }
    .hidden { display: none; }
    .step { font-size: 11px; color: #b0bec5; margin: 3px 0; }
    .step b { color: #4fc3f7; }
    .badge { display: inline-block; background: #4caf50; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: 6px; }
  </style>
</head>
<body>
  <h1>G5 Auth Helper v1.4</h1>

  <div class="card" style="border-color:#ffa726">
    <div class="step"><b>1.</b> Reload extension ini</div>
    <div class="step"><b>2.</b> Buka <b>aistudio.galleri5.com</b> → <b>F5 reload</b> → login</div>
    <div class="step"><b>3.</b> Submit motion control (image + video)</div>
    <div class="step"><b>4.</b> Tunggu 5 detik → klik <b>Firebase Token</b></div>
  </div>

  <div style="display:flex;gap:4px;flex-wrap:wrap;margin:8px 0;">
    <button class="btn" id="btnShow">Show Headers</button>
    <button class="btn" id="btnFirebase">Firebase Token</button>
    <button class="btn" id="btnAll">All Requests</button>
    <button class="btn" id="btnClear">Clear</button>
    <button class="btn" id="btnInject">Re-inject</button>
  </div>

  <div id="status" class="status hidden"></div>

  <div id="submitSection" class="hidden">
    <h2>Captured Headers</h2>
    <div id="submitHeaders" class="card"></div>
  </div>

  <div id="tokenSection" class="hidden">
    <h2>Headers JSON (paste ke Providers)</h2>
    <textarea id="tokenArea" readonly></textarea>
    <button class="btn" id="btnCopy" style="margin-top:6px">Copy to Clipboard</button>
  </div>

  <div id="firebaseSection" class="hidden">
    <h2>Firebase Auth Token <span id="firebaseStatus"></span></h2>
    <div id="firebaseToken"></div>
    <button class="btn" id="btnCopyFirebase" style="margin-top:6px">Copy Token</button>
  </div>

  <div id="allSection" class="hidden">
    <h2>Recent Requests</h2>
    <div id="allRequests"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
