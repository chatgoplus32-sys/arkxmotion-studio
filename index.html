<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Ikon: PNG kecil 64px (6 KB). Versi lama menunjuk file 440px (136 KB)
         yang diunduh untuk setiap visitor. -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="shortcut icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050816" />
    <meta
      name="description"
      content="Buat video AI sinematik, animasi, film, musik & konten kreatif otomatis dengan ARKXMotion Studio. Cukup upload video ngomong atau foto produk — AI menyusun caption, b-roll, transisi & CTA otomatis."
    />
    <meta name="author" content="ARKXMotion Studio" />
    <link rel="canonical" href="https://arkxmotion-studio.win/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ARKXMotion Studio" />
    <meta property="og:url" content="https://arkxmotion-studio.win/" />
    <meta property="og:title" content="ARKXMotion Studio — AI Video Generation Platform" />
    <meta
      property="og:description"
      content="Buat video AI sinematik, animasi, musik & konten kreatif otomatis. Upload video ngomong atau foto produk — hasil profesional dalam hitungan menit."
    />
    <meta property="og:image" content="https://arkxmotion-studio.win/landing/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="id_ID" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ARKXMotion Studio — AI Video Generation Platform" />
    <meta
      name="twitter:description"
      content="Buat video AI sinematik, animasi, musik & konten kreatif otomatis. Upload video ngomong atau foto produk — hasil profesional dalam hitungan menit."
    />
    <meta name="twitter:image" content="https://arkxmotion-studio.win/landing/og-image.jpg" />

    <!-- Structured data -->
    <!-- @graph: Organization (entitas) + WebSite (sitelinks searchbox) +
         WebApplication (rich result "app" di Google).og-image.jpg dipilih
         daripada WebP karena beberapa scraper (WhatsApp, LinkedIn) masih
         tidak men-render WebP di preview link. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://arkxmotion-studio.win/#org",
            "name": "ARKXMotion Studio",
            "url": "https://arkxmotion-studio.win/",
            "logo": "https://arkxmotion-studio.win/apple-touch-icon.png",
            "description": "Platform kreatif AI all-in-one: buat video AI sinematik, animasi, film, musik dan konten kreatif otomatis dari upload video ngomong atau foto produk.",
            "sameAs": []
          },
          {
            "@type": "WebSite",
            "@id": "https://arkxmotion-studio.win/#website",
            "url": "https://arkxmotion-studio.win/",
            "name": "ARKXMotion Studio",
            "description": "Buat video AI sinematik, animasi, film, musik & konten kreatif otomatis dengan ARKXMotion Studio.",
            "publisher": { "@id": "https://arkxmotion-studio.win/#org" },
            "inLanguage": "id-ID"
          },
          {
            "@type": "WebApplication",
            "@id": "https://arkxmotion-studio.win/#app",
            "name": "ARKXMotion Studio",
            "url": "https://arkxmotion-studio.win/",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Web",
            "description": "Studio AI all-in-one untuk generate video: motion control, image-to-video, bulk fashion, upscaling, musik & voice over dari 20 provider AI dalam satu dashboard.",
            "publisher": { "@id": "https://arkxmotion-studio.win/#org" },
            "browserRequirements": "Requires JavaScript",
            "offers": {
              "@type": "Offer",
              "price": "250000",
              "priceCurrency": "IDR",
              "description": "Membership Pro sekali bayar (permanen); token generate dibayar terpisah per pemakaian."
            }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400..900;1,600..900&display=swap"
      rel="stylesheet"
    />
    <title>ARKXMotion Studio — AI Video Generation Platform</title>
    <style>
      body {
        background-color: #050816;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
