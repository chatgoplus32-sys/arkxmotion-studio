# /etc/nginx/sites-available/arkxmotion-studio
# ARKXMotion Studio — Nginx Reverse Proxy + SSL

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name arkxmotion-studio.win www.arkxmotion-studio.win;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arkxmotion-studio.win www.arkxmotion-studio.win;

    # SSL (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/arkxmotion-studio.win/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arkxmotion-studio.win/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Max upload size (for video/image uploads)
    client_max_body_size 50m;

    # Proxy timeouts
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 300s;

    # Static assets — serve directly from Nginx (fast)
    location /assets/ {
        alias /opt/arkxmotion-studio/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|eot)$ {
        root /opt/arkxmotion-studio/dist/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Service worker — no cache
    location = /sw.js {
        root /opt/arkxmotion-studio/dist/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        access_log off;
    }

    # API routes → Express backend (port 6000)
    location /api/ {
        proxy_pass http://127.0.0.1:6000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE/WebSocket support (for background polling)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
    }

    # Everything else → Express backend (serves SPA index.html in production)
    location / {
        proxy_pass http://127.0.0.1:6000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Deny dotfiles (except .well-known)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Logs
    access_log /var/log/nginx/arkxmotion-studio.access.log;
    error_log /var/log/nginx/arkxmotion-studio.error.log;
}
