server {
    listen 443 ssl;
    http2 on;
    server_name arkxmotion-studio.win www.arkxmotion-studio.win;

    client_max_body_size 50M;
    root /opt/arkxmotion-studio/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/arkxmotion-studio.win/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arkxmotion-studio.win/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    # Nexabot Proxy — admin dashboard & API
    location /nexabot/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nexabot Proxy — generate API
    location /v1/ {
        proxy_pass http://127.0.0.1:3000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:6000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # /studio/ dan /studio/index.html selalu revalidate supaya perbaikan
    # bundel langsung terlihat; aset ber-hash di /studio/assets/ tetap immutable
    location = /studio/ {
        add_header Cache-Control "no-cache, must-revalidate";
        # add_header di level location menimpa level server — deklarasikan ulang
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
    }

    location = /studio/index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
    }

    # HTML selalu revalidate supaya deploy baru langsung terlihat
    # (aset ber-hash tetap immutable — di-cache lama dengan aman)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        # add_header di location menimpa level server — deklarasikan ulang security headers
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
    }

    # Service worker: jangan di-cache — kalau tidak, browser memegang sw.js lama
    # dan update aplikasi tidak pernah sampai (SW punya max 24 jam, nginx 7 hari).
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
    }

    # Logo: URL-nya stabil (rebrand menimpa file yang sama) — jangan di-cache
    # 7 hari supaya logo baru langsung terlihat. File kecil, revalidate murah.
    location = /landing/arkx-icon.png {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
    }

    # Ikon berversi v2 — URL baru agar browser yang pernah menyimpan ikon lama
    # (immutable 7 hari) langsung ambil ikon baru tanpa hard refresh.
    location = /landing/arkx-icon-v2.png {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
    }

    location = /landing/arkx-logo.jpg {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name arkxmotion-studio.win www.arkxmotion-studio.win;
    return 301 https://$host$request_uri;
}
