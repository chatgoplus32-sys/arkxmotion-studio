<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="50%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8ff"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Top blade -->
  <path d="M128 40 L158 120 L128 100 L98 120 Z" fill="url(#metalGrad)" opacity="0.95"/>
  <!-- Right blade -->
  <path d="M218 128 L138 158 L148 128 L138 98 Z" fill="url(#metalGrad)" opacity="0.95"/>
  <!-- Bottom blade -->
  <path d="M128 216 L98 138 L128 148 L158 138 Z" fill="url(#metalGrad)" opacity="0.95"/>
  <!-- Left blade -->
  <path d="M38 128 L118 98 L108 128 L118 158 Z" fill="url(#metalGrad)" opacity="0.95"/>

  <!-- Center diamond -->
  <path d="M128 90 L165 128 L128 166 L91 128 Z" fill="url(#metalGrad)" opacity="0.98"/>

  <!-- Blue glow outlines -->
  <path d="M128 40 L158 120 L128 100 L98 120 Z" fill="none" stroke="#00a8ff" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  <path d="M218 128 L138 158 L148 128 L138 98 Z" fill="none" stroke="#00a8ff" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  <path d="M128 216 L98 138 L128 148 L158 138 Z" fill="none" stroke="#00a8ff" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  <path d="M38 128 L118 98 L108 128 L118 158 Z" fill="none" stroke="#00a8ff" stroke-width="2" opacity="0.6" filter="url(#glow)"/>

  <!-- Center glow circle -->
  <circle cx="128" cy="128" r="22" fill="#00a8ff" filter="url(#glow)" opacity="0.9"/>
  <circle cx="128" cy="128" r="16" fill="#00d4ff" opacity="0.95"/>
  <circle cx="128" cy="128" r="8" fill="white" opacity="0.5"/>

  <!-- Node dots -->
  <circle cx="128" cy="90" r="7" fill="#00a8ff" filter="url(#glow)" opacity="0.9"/>
  <circle cx="165" cy="128" r="7" fill="#00a8ff" filter="url(#glow)" opacity="0.9"/>
  <circle cx="128" cy="166" r="7" fill="#00a8ff" filter="url(#glow)" opacity="0.9"/>
  <circle cx="91" cy="128" r="7" fill="#00a8ff" filter="url(#glow)" opacity="0.9"/>
</svg>
