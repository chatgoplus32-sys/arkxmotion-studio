<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8ff"/>
      <stop offset="40%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="50%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Top blade -->
  <path d="M100 20 L130 95 L100 80 L70 95 Z" fill="url(#metalGrad)" opacity="0.95"/>
  <!-- Right blade -->
  <path d="M170 100 L95 130 L105 100 L95 70 Z" fill="url(#metalGrad)" opacity="0.95"/>
  <!-- Bottom blade -->
  <path d="M100 180 L70 105 L100 115 L130 105 Z" fill="url(#metalGrad)" opacity="0.95"/>
  <!-- Left blade -->
  <path d="M30 100 L105 70 L95 100 L105 130 Z" fill="url(#metalGrad)" opacity="0.95"/>

  <!-- Center diamond -->
  <path d="M100 70 L130 100 L100 130 L70 100 Z" fill="url(#metalGrad)" opacity="0.98"/>

  <!-- Blue glow outlines -->
  <path d="M100 20 L130 95 L100 80 L70 95 Z" fill="none" stroke="#00a8ff" stroke-width="1.5" opacity="0.6" filter="url(#glow)"/>
  <path d="M170 100 L95 130 L105 100 L95 70 Z" fill="none" stroke="#00a8ff" stroke-width="1.5" opacity="0.6" filter="url(#glow)"/>
  <path d="M100 180 L70 105 L100 115 L130 105 Z" fill="none" stroke="#00a8ff" stroke-width="1.5" opacity="0.6" filter="url(#glow)"/>
  <path d="M30 100 L105 70 L95 100 L105 130 Z" fill="none" stroke="#00a8ff" stroke-width="1.5" opacity="0.6" filter="url(#glow)"/>

  <!-- Center glow -->
  <circle cx="100" cy="100" r="14" fill="#00a8ff" filter="url(#glow)" opacity="0.9"/>
  <circle cx="100" cy="100" r="10" fill="#00d4ff" opacity="0.95"/>
  <circle cx="100" cy="100" r="5" fill="white" opacity="0.5"/>

  <!-- Text: ARKXMotion Studio -->
  <text x="190" y="128" 
        font-family="Inter, system-ui, -apple-system, sans-serif" 
        font-size="64" 
        font-weight="700" 
        fill="white" 
        letter-spacing="-1">ARKXMotion Studio</text>
</svg>
