<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6a00"/>
      <stop offset="50%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ffb800"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
  </defs>

  <!-- Icon (scaled down) -->
  <g transform="translate(5, 2) scale(0.22)">
    <path d="M60 30 L200 128 L60 226 Z" 
          fill="none" stroke="url(#whiteGrad)" stroke-width="14" stroke-linejoin="round"/>
    <line x1="90" y1="80" x2="170" y2="176" stroke="url(#orangeAccent)" stroke-width="14" stroke-linecap="round"/>
    <line x1="170" y1="80" x2="90" y2="176" stroke="url(#orangeAccent)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="90" cy="80" r="12" fill="url(#orangeAccent)"/>
    <circle cx="170" cy="80" r="12" fill="url(#orangeAccent)"/>
    <circle cx="90" cy="176" r="12" fill="url(#orangeAccent)"/>
    <circle cx="170" cy="176" r="12" fill="url(#orangeAccent)"/>
    <circle cx="130" cy="128" r="12" fill="url(#orangeAccent)"/>
    <line x1="90" y1="80" x2="130" y2="128" stroke="url(#orangeAccent)" stroke-width="5" opacity="0.6"/>
    <line x1="170" y1="80" x2="130" y2="128" stroke="url(#orangeAccent)" stroke-width="5" opacity="0.6"/>
    <line x1="90" y1="176" x2="130" y2="128" stroke="url(#orangeAccent)" stroke-width="5" opacity="0.6"/>
    <line x1="170" y1="176" x2="130" y2="128" stroke="url(#orangeAccent)" stroke-width="5" opacity="0.6"/>
  </g>

  <!-- Text -->
  <text x="56" y="38" 
        font-family="Inter, system-ui, -apple-system, sans-serif" 
        font-size="22" 
        font-weight="700" 
        fill="white" 
        letter-spacing="-0.5">ARKXMotion</text>
  <text x="56" y="52" 
        font-family="Inter, system-ui, -apple-system, sans-serif" 
        font-size="11" 
        font-weight="500" 
        fill="#ff8c00" 
        letter-spacing="3">STUDIO</text>
</svg>