<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8ff"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c0c0c0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon (shuriken shape) -->
  <g transform="translate(5, 2) scale(0.22)">
    <!-- Top blade -->
    <path d="M130 30 L160 120 L130 100 L100 120 Z" fill="url(#metalGrad)" opacity="0.95"/>
    <!-- Right blade -->
    <path d="M270 130 L180 160 L200 130 L180 100 Z" fill="url(#metalGrad)" opacity="0.95"/>
    <!-- Bottom blade -->
    <path d="M130 230 L100 140 L130 160 L160 140 Z" fill="url(#metalGrad)" opacity="0.95"/>
    <!-- Left blade -->
    <path d="M-10 130 L80 100 L60 130 L80 160 Z" fill="url(#metalGrad)" opacity="0.95"/>
    <!-- Center -->
    <path d="M130 85 L168 130 L130 175 L92 130 Z" fill="url(#metalGrad)" opacity="0.98"/>
    <!-- Blue glow -->
    <path d="M130 30 L160 120 L130 100 L100 120 Z" fill="none" stroke="#00a8ff" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
    <path d="M270 130 L180 160 L200 130 L180 100 Z" fill="none" stroke="#00a8ff" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
    <path d="M130 230 L100 140 L130 160 L160 140 Z" fill="none" stroke="#00a8ff" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
    <path d="M-10 130 L80 100 L60 130 L80 160 Z" fill="none" stroke="#00a8ff" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
    <!-- Center circle -->
    <circle cx="130" cy="130" r="18" fill="#00a8ff" filter="url(#glow)" opacity="0.9"/>
    <circle cx="130" cy="130" r="12" fill="#00d4ff" opacity="0.95"/>
    <circle cx="130" cy="130" r="6" fill="white" opacity="0.5"/>
    <!-- Node dots -->
    <circle cx="130" cy="85" r="6" fill="#00a8ff" opacity="0.9"/>
    <circle cx="168" cy="130" r="6" fill="#00a8ff" opacity="0.9"/>
    <circle cx="130" cy="175" r="6" fill="#00a8ff" opacity="0.9"/>
    <circle cx="92" cy="130" r="6" fill="#00a8ff" opacity="0.9"/>
  </g>

  <!-- Text -->
  <text x="56" y="38" 
        font-family="Inter, system-ui, -apple-system, sans-serif" 
        font-size="22" 
        font-weight="700" 
        fill="white" 
        letter-spacing="-0.5">ARKXMotion</text>
  <text x="56" y="52" 
        font-family="Inter, system-ui, -apple-system, sans-serif" 
        font-size="11" 
        font-weight="500" 
        fill="#00a8ff" 
        letter-spacing="3">STUDIO</text>
</svg>
