<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="metalLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
    <linearGradient id="chromeDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
    <linearGradient id="blueEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="50%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#00ddff"/>
    </linearGradient>
    <filter id="blueGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shuriken icon -->
  <g transform="translate(8, 6) scale(0.2)">
    <!-- Top blade -->
    <path d="M128 16 L158 106 L142 112 L128 80 L114 112 L98 106 Z" fill="url(#metalLight)" opacity="0.95"/>
    <!-- Right blade -->
    <path d="M240 128 L150 98 L144 114 L160 128 L144 142 L150 158 Z" fill="url(#metalLight)" opacity="0.95"/>
    <!-- Bottom blade -->
    <path d="M128 240 L98 150 L114 144 L128 160 L142 144 L150 150 Z" fill="url(#metalLight)" opacity="0.95"/>
    <!-- Left blade -->
    <path d="M16 128 L106 158 L112 142 L96 128 L112 114 L106 98 Z" fill="url(#metalLight)" opacity="0.95"/>
    <!-- Blue glow -->
    <path d="M128 16 L158 106 L142 112 L128 80 L114 112 L98 106 Z" fill="none" stroke="url(#blueEdge)" stroke-width="2" opacity="0.7" filter="url(#blueGlow)"/>
    <path d="M240 128 L150 98 L144 114 L160 128 L144 142 L150 158 Z" fill="none" stroke="url(#blueEdge)" stroke-width="2" opacity="0.7" filter="url(#blueGlow)"/>
    <path d="M128 240 L98 150 L114 144 L128 160 L142 144 L150 150 Z" fill="none" stroke="url(#blueEdge)" stroke-width="2" opacity="0.7" filter="url(#blueGlow)"/>
    <path d="M16 128 L106 158 L112 142 L96 128 L112 114 L106 98 Z" fill="none" stroke="url(#blueEdge)" stroke-width="2" opacity="0.7" filter="url(#blueGlow)"/>
    <!-- Chrome nodes -->
    <circle cx="128" cy="60" r="8" fill="url(#chromeDot)" filter="url(#softGlow)"/>
    <circle cx="196" cy="128" r="8" fill="url(#chromeDot)" filter="url(#softGlow)"/>
    <circle cx="128" cy="196" r="8" fill="url(#chromeDot)" filter="url(#softGlow)"/>
    <circle cx="60" cy="128" r="8" fill="url(#chromeDot)" filter="url(#softGlow)"/>
    <!-- Center glow -->
    <circle cx="128" cy="128" r="12" fill="#00a8ff" opacity="0.5"/>
    <circle cx="128" cy="128" r="7" fill="#00d4ff" opacity="0.7"/>
    <circle cx="128" cy="128" r="3" fill="white" opacity="0.6"/>
  </g>

  <!-- Text -->
  <text x="56" y="38" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="white" letter-spacing="-0.5">ARKXMotion</text>
  <text x="56" y="52" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#00a8ff" letter-spacing="3">STUDIO</text>
</svg>
