<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d18">
  <meta name="description" content="ARKX Drama studio v2 — ruang kerja lokal untuk cerita, antrean prompt, dan susunan klip.">
  <title>ARKX Drama studio v2</title>
  <link rel="preload" href="assets/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script defer src="assets/xlsx.full.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="ARKX Drama studio v2">
        <span class="brand-mark">A<span>×</span></span>
        <span class="brand-name">ARKX Drama<small>STUDIO V2</small></span>
      </a>
      <div class="local-indicator"><i></i><span>Workspace lokal <b>·</b> tanpa login</span></div>
      <div class="side-label">WORKSPACE</div>
      <nav class="side-nav" aria-label="Navigasi utama">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">⌂</span> Ringkasan</button>
        <button class="nav-item" data-page="story"><span class="nav-icon">✧</span> AI Story <em>LOCAL</em></button>
        <button class="nav-item" data-page="storyboard"><span class="nav-icon">▤</span> Storyboard</button>
        <button class="nav-item" data-page="queue"><span class="nav-icon">☷</span> Prompt queue <span class="nav-count" id="navQueueCount">0</span></button>
        <button class="nav-item" data-page="workspace"><span class="nav-icon">▧</span> Story workspace</button>
      </nav>
      <div class="sidebar-projects">
        <div class="side-label">PROYEK AKTIF</div>
        <button class="active-project" id="sideProject"><span class="project-dot"></span><span id="sideProjectName">Malam di Stasiun</span><span class="chevron">⌄</span></button>
        <button class="new-project-link" data-action="new-project"><span>＋</span> Proyek baru</button>
      </div>
      <div class="sidebar-bottom">
        <div class="privacy-card"><span class="privacy-icon">◈</span><div><b>Data di perangkat ini</b><small>Autosave browser aktif</small></div><span class="privacy-check">✓</span></div>
        <div class="version-label">ARKX Drama studio v2 <span>PREVIEW</span></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left"><a class="icon-button back-link" href="/dashboard" aria-label="Kembali ke ARKXMotion Studio" title="Kembali ke ARKXMotion Studio" style="margin-right:8px">←</a><button class="icon-button mobile-menu" id="menuToggle" aria-label="Buka menu">☰</button><div class="breadcrumb"><span>ARKX Drama</span><b>/</b><strong id="crumbPage">Ringkasan</strong></div></div>
        <div class="topbar-right"><span class="save-state"><i></i><span id="saveLabel">Tersimpan lokal</span></span><button class="top-project" id="projectSwitcher"><span class="project-dot"></span><span id="topProjectName">Malam di Stasiun</span><span>⌄</span></button><button class="button button-primary button-small" data-action="new-project"><span>＋</span> Proyek baru</button><button class="avatar" aria-label="Mode tanpa akun">Y</button></div>
      </header>
      <div class="page-content" id="pageContent" tabindex="-1"></div>
      <footer class="app-footer"><span>ARKX Drama studio v2</span><span>Gemini API · GPT Image 2.5 · Omni Flash 1.2</span></footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input id="importInput" class="visually-hidden" type="file" accept=".txt,.csv,.xlsx,.xls,text/plain,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel">
</body>
</html>
