<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0"/>
      <stop offset="30%" style="stop-color:#e8e8e8"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="70%" style="stop-color:#e0e0e0"/>
      <stop offset="100%" style="stop-color:#a0a0a0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8860b"/>
      <stop offset="30%" style="stop-color:#d4a017"/>
      <stop offset="50%" style="stop-color:#ffd700"/>
      <stop offset="70%" style="stop-color:#e8b000"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="silverGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#808080"/>
      <stop offset="50%" style="stop-color:#c0c0c0"/>
      <stop offset="100%" style="stop-color:#909090"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer glow -->
  <circle cx="64" cy="52" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Triangle A - Silver/Chrome -->
  <path d="M64 16 L96 90 L32 90 Z" 
        fill="none" 
        stroke="url(#silverGrad)" 
        stroke-width="6" 
        stroke-linejoin="round"
        stroke-linecap="round"/>
  
  <!-- Inner triangle detail -->
  <path d="M64 30 L82 78 L46 78 Z" 
        fill="none" 
        stroke="url(#silverGradDark)" 
        stroke-width="1.5" 
        opacity="0.4"/>
  
  <!-- X shape - Gold -->
  <path d="M44 52 L84 82" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
  <path d="M84 52 L44 82" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- X inner highlight -->
  <path d="M46 52 L82 80" stroke="#ffd700" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M82 52 L46 80" stroke="#ffd700" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Speed lines -->
  <path d="M86 56 L116 48" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M88 64 L120 64" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M86 72 L116 80" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M84 80 L108 92" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  
  <!-- Play button -->
  <polygon points="56,62 56,74 68,68" fill="url(#goldGrad)"/>
  
  <!-- Play button glow -->
  <circle cx="62" cy="68" r="12" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>
</svg>
