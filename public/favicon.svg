<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="30%" stop-color="#e8e8e8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080cc"/>
      <stop offset="30%" stop-color="#00a8ff"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="70%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#0080cc"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#0c0c1a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer glow ring -->
  <circle cx="64" cy="52" r="45" fill="none" stroke="url(#blueGrad)" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Top blade -->
  <path d="M64 16 L84 72 L64 60 L44 72 Z" fill="url(#metalGrad)" opacity="0.95"/>
  <!-- Right blade -->
  <path d="M108 52 L72 72 L78 52 L72 32 Z" fill="url(#metalGrad)" opacity="0.95"/>
  <!-- Bottom blade -->
  <path d="M64 88 L44 52 L64 56 L84 52 Z" fill="url(#metalGrad)" opacity="0.95"/>
  <!-- Left blade -->
  <path d="M20 52 L56 32 L50 52 L56 72 Z" fill="url(#metalGrad)" opacity="0.95"/>
  
  <!-- Center diamond -->
  <path d="M64 36 L82 52 L64 68 L46 52 Z" fill="url(#metalGrad)" opacity="0.98"/>
  
  <!-- Blue glow outlines -->
  <path d="M64 16 L84 72 L64 60 L44 72 Z" fill="none" stroke="#00a8ff" stroke-width="1.5" opacity="0.6" filter="url(#glow)"/>
  <path d="M108 52 L72 72 L78 52 L72 32 Z" fill="none" stroke="#00a8ff" stroke-width="1.5" opacity="0.6" filter="url(#glow)"/>
  <path d="M64 88 L44 52 L64 56 L84 52 Z" fill="none" stroke="#00a8ff" stroke-width="1.5" opacity="0.6" filter="url(#glow)"/>
  <path d="M20 52 L56 32 L50 52 L56 72 Z" fill="none" stroke="#00a8ff" stroke-width="1.5" opacity="0.6" filter="url(#glow)"/>
  
  <!-- Center glow circle -->
  <circle cx="64" cy="52" r="10" fill="#00a8ff" filter="url(#glow)" opacity="0.9"/>
  <circle cx="64" cy="52" r="7" fill="#00d4ff" opacity="0.95"/>
  <circle cx="64" cy="52" r="3.5" fill="white" opacity="0.5"/>
  
  <!-- Node dots -->
  <circle cx="64" cy="36" r="4" fill="#00a8ff" opacity="0.9"/>
  <circle cx="82" cy="52" r="4" fill="#00a8ff" opacity="0.9"/>
  <circle cx="64" cy="68" r="4" fill="#00a8ff" opacity="0.9"/>
  <circle cx="46" cy="52" r="4" fill="#00a8ff" opacity="0.9"/>
</svg>
